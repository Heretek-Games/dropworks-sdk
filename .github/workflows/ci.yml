name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Test Rust binding scaffold
        run: cargo test --manifest-path bindings/rust/Cargo.toml --locked --features c-abi

  c-abi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build libdropworks
        run: cargo build --manifest-path bindings/rust/Cargo.toml --locked --features c-abi

      - name: C ABI smoke test
        run: |
          cc -Iinclude bindings/c/smoke.c \
            -Lbindings/rust/target/debug -ldropworks -o /tmp/dropworks-smoke
          LD_LIBRARY_PATH=bindings/rust/target/debug /tmp/dropworks-smoke

  csharp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build libdropworks
        run: cargo build --manifest-path bindings/rust/Cargo.toml --locked --features c-abi

      - name: Build C# binding
        run: dotnet build bindings/csharp/Dropworks.Smoke/Dropworks.Smoke.csproj -c Release

      - name: C# binding smoke test
        run: LD_LIBRARY_PATH=bindings/rust/target/debug dotnet run --project bindings/csharp/Dropworks.Smoke/Dropworks.Smoke.csproj -c Release --no-build

  gdscript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          curl -sSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -oq /tmp/godot.zip -d /tmp/godot

      - name: GDScript binding test
        run: |
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless \
            --path bindings/gdscript --script test_dropworks.gd
